services:
  lumina:
    build: .
    container_name: lumina
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # - SEARXNG_URL=http://searxng:8080  # Optional: enable real-time web search via SearXNG
    depends_on:
      - ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    image: ollama/ollama:latest
    container_name: lumina-ollama
    restart: unless-stopped
    # Only expose on localhost — Lumina connects via Docker internal network
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-data:
    name: lumina_ollama-data
